<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melbourne Sport Map</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #2980b9; --success: #27ae60; --error: #e74c3c; --hover-bg: #f9f9f9; }
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        
        /* Navigation */
        #nav-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background-color: var(--primary); 
            color: white; 
            padding: 15px 30px; 
            position: sticky; 
            top: 0; 
            z-index: 1000;
        }

        /* Dropdown Menu */
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 10px 25px; 
            border-radius: 5px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold;
        }
        .dropdown-content { 
            display: none; 
            position: absolute; 
            right: 0; 
            background-color: white; 
            min-width: 180px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.2); 
            border-radius: 5px;
            z-index: 1001;
        }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a { color: #333; padding: 12px 16px; text-decoration: none; display: block; cursor: pointer; }
        .dropdown-content a:hover { background-color: #f1f1f1; }

        .container { padding: 20px; max-width: 1400px; margin: auto; }
        .header-box { background: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; border: 1px solid #ddd; }
        
        /* Map Window Styling */
        .map-container { 
            width: 100%; 
            height: 400px; 
            background: #eee; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            overflow: hidden; 
            border: 1px solid #ddd;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* Layout & Fixed Column Spacing */
        .table-wrapper { background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed; }
        
        thead { background-color: #eee; color: #333; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #ddd; font-size: 14px; overflow: hidden; word-wrap: break-word; }
        
        /* Row Highlight */
        tbody tr:hover { background-color: var(--hover-bg); transition: background-color 0.2s ease; }

        /* Strict Column Width Assignments */
        .col-name { width: 28%; }
        .col-suburb { width: 22%; }
        .col-hours { width: 25%; }
        .col-price { width: 15%; }
        .col-book { width: 10%; }

        .venue-link { color: var(--accent); font-weight: bold; text-decoration: none; }
        .venue-link:hover { text-decoration: underline; color: #1a5276; }
        
        .btn-book { 
            padding: 8px 12px; 
            border-radius: 4px; 
            text-decoration: none; 
            font-size: 12px; 
            font-weight: bold; 
            color: white; 
            display: inline-block; 
            background: var(--success); 
        }
    </style>
</head>
<body onload="initApp()">

    <div id="nav-bar">
        <div style="font-size: 20px; font-weight: bold;">Melbourne Sport Map</div>
        <div class="dropdown">
            <button class="dropbtn">Menu ▾</button>
            <div class="dropdown-content">
                <a onclick="loadSport('Tennis')">Tennis</a>
                <a onclick="loadSport('Badminton')">Badminton</a>
                <a onclick="loadSport('Basketball')">Basketball</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header-box">
            <h1 id="page-title" style="margin:0;">Directory</h1>
        </div>

        <div class="map-container" id="map-box">
            <iframe id="google-map" src="about:blank"></iframe>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-name">Venue Name (Map Link)</th>
                        <th class="col-suburb">Suburb & Region</th>
                        <th class="col-hours">Hours</th>
                        <th class="col-price">Price</th>
                        <th class="col-book">Booking</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        function loadSport(sport) {
            let fileName = '';
            let mapQuery = '';

            if (sport === 'Tennis') {
                fileName = 'Melbourne_Tennis_Courts_Directory.csv';
                mapQuery = 'Tennis+Courts+Melbourne';
            } else if (sport === 'Badminton') {
                fileName = 'Melbourne_Badminton_Courts_Directory.CSV';
                mapQuery = 'Badminton+Courts+Melbourne';
            } else if (sport === 'Basketball') {
                fileName = 'Melbourne_Basketball_Courts_Directory.csv';
                mapQuery = 'Basketball+Courts+Melbourne';
            }
            
            document.getElementById('page-title').innerText = `${sport} Directory`;
            
            // Update the Map Window for the selected sport
            const mapFrame = document.getElementById('google-map');
            mapFrame.src = `https://www.google.com/maps/embed/v1/search?key=YOUR_GOOGLE_MAPS_API_KEY&q=${mapQuery}&zoom=11`;
            // NOTE: If you don't have an API key yet, I am using a search embed logic below that works for most browsers:
            mapFrame.src = `https://maps.google.com/maps?q=${mapQuery}&t=&z=11&ie=UTF8&iwloc=&output=embed`;

            Papa.parse(fileName, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    renderTable(results.data);
                },
                error: function() {
                    console.error("Error loading CSV file.");
                }
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            data.forEach(row => {
                if (!row.name) return;
                const tr = document.createElement('tr');
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(row.name + ' ' + (row.suburb || ''))}`;
                const bookUrl = (row.booking && row.booking !== "Check website") ? row.booking : (row.website || "#");

                tr.innerHTML = `
                    <td class="col-name"><a href="${mapUrl}" target="_blank" class="venue-link">${row.name} 📍</a></td>
                    <td class="col-suburb">${row.suburb || ''}, ${row.region || ''}</td>
                    <td class="col-hours" style="font-size:12px; color: #333;">${(row.hours || '').replace(/\n/g, '<br>')}</td>
                    <td class="col-price" style="font-weight:bold;">${row.price || ''}</td>
                    <td class="col-book"><a href="${bookUrl}" target="_blank" class="btn-book">BOOK</a></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function initApp() { loadSport('Tennis'); }
    </script>
</body>
</html>
